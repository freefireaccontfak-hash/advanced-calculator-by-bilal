<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Google Login</title>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg, #4285F4, #34A853);
      font-family: Arial;
    }

    .box{
      background:white;
      padding:30px;
      border-radius:15px;
      text-align:center;
      width:300px;
      box-shadow:0 10px 25px rgba(0,0,0,0.3);
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:#4285F4;
      color:white;
      font-size:16px;
      cursor:pointer;
    }

    button:hover{
      background:#3367d6;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Login with Google</h2>
  <button onclick="login()">Sign in with Google</button>
</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// 🔥 Your Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyAfylzepy_d1_80ugAj9lkIgjQcExOG7eM",
  authDomain: "login-app-b97a6.firebaseapp.com",
  projectId: "login-app-b97a6",
  storageBucket: "login-app-b97a6.firebasestorage.app",
  messagingSenderId: "541207988783",
  appId: "1:541207988783:web:392155a0b62181a2f094da"
};

// init
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

// login function
window.login = function () {
  signInWithPopup(auth, provider)
    .then((result) => {
      // success → open app
      window.location.href = "app.html";
    })
    .catch((error) => {
      alert("Login Failed");
      console.log(error);
    });
};
</script>

</body>
</html>
